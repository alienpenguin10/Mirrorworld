[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirrorworld"
dynamic = ["version"]
description = "Fetch street-level, aerial, satellite, elevation, LiDAR and map data for any place"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "alienpenguin10" },
  { name = "sk-zk", email = "sk-zk@users.noreply.github.com" },
]
maintainers = [
  { name = "alienpenguin10" },
]
requires-python = ">=3.10"
keywords = ["street view", "mapillary", "aerial imagery", "satellite", "lidar", "elevation", "gis", "remote sensing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "aiohttp",
    "bd09convertor",
    "CoordinatesConverter",
    "cython",
    "mapbox-vector-tile",
    "numpy",
    "Pillow",
    "protobuf > 4",
    "pycryptodome",
    "pyequilib",
    "pyexiv2",
    "pyfrpc == 0.2.13",
    "pyproj",
    "requests",
    "scipy",
]

[project.optional-dependencies]
# GeoTIFF/COG reading and writing (mirrorworld.services WCS/ArcGIS tiff, elevation, satellite, Raster.save to .tif)
raster = ["rasterio"]
# LiDAR point clouds (mirrorworld.lidar)
lidar = ["laspy[lazrs]"]
all = ["rasterio", "laspy[lazrs]"]

[dependency-groups]
# Development only (PEP 735): not part of the published metadata. Install with `pip install --group test`.
test = ["pytest", "pytest-asyncio", "rasterio", "laspy[lazrs]"]

[project.urls]
"Homepage" = "https://github.com/alienpenguin10/Mirrorworld"
"Bug Tracker" = "https://github.com/alienpenguin10/Mirrorworld/issues"
"Based on" = "https://github.com/sk-zk/streetlevel"

[tool.hatch.build.targets.sdist]
include = ["mirrorworld", "tests", "docs", "README.md", "LICENSE", "CREDITS.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["mirrorworld"]

[tool.hatch.version]
path = "mirrorworld/__init__.py"
